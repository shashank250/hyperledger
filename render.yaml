services:
  - type: web
    name: steady-financial-coach
    runtime: docker
    plan: 0.5c-512mb
    healthCheckPath: /api/health
    disk:
      name: steady-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
