function categoryChart(f,budgets){const entries=Object.entries(f.spendBy||{}).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]).slice(0,6);if(!entries.length)return `<div class="empty" style="padding:32px"><strong>No spending imported yet</strong><span>Your category picture will appear when transactions arrive.</span></div>`;const colors=['#216a50','#abc878','#efc478','#cb8771','#7c9dc2','#a38ac4'];let max=Math.max(...entries.map(x=>x[1]),1);return `<div class="plot"><svg viewBox="0 0 700 175" preserveAspectRatio="none">${[0,1,2,3].map(i=>`<line x1="0" y1="${22+i*40}" x2="700" y2="${22+i*40}" stroke="var(--line)" stroke-width="1"/>`).join('')}${entries.map(([name,v],i)=>{let x=18+i*112,w=68,h=Math.max(4,v/max*120),budget=Number(budgets[name]||0),bh=budget?Math.max(2,budget/max*120):0;return `<rect x="${x}" y="${152-h}" width="${w}" height="${h}" rx="6" fill="${colors[i%colors.length]}" opacity=".9"><title>${escapeHTML(name)}: ${money(v)}${budget?' / '+money(budget)+' budget':''}</title></rect>${budget?`<rect x="${x+24}" y="${152-bh}" width="20" height="${bh}" rx="4" fill="var(--green2)" opacity=".85"/>`:''}<text x="${x+34}" y="169" text-anchor="middle" font-size="9" fill="var(--muted)" font-family="DM Sans">${escapeHTML(name.slice(0,12))}</text><text x="${x+34}" y="${Math.max(16,143-h)}" text-anchor="middle" font-size="9" fill="var(--muted)" font-family="DM Sans">${money(v)}</text>`}).join('')}</svg></div>`}
function goalHTML(g){const pct=Math.min(100,Math.round(g.saved/g.target*100));return `<div class="goal"><div class="goal-top"><div><div class="goal-name">${escapeHTML(g.name)}</div><div class="goal-meta">Target ${new Date(g.due_date+'T12:00:00').toLocaleDateString('en-US',{month:'short',year:'numeric'})} · ${money(g.monthly)}/mo planned</div></div><div class="goal-money">${money(g.saved)}<div class="goal-meta">of ${money(g.target)}</div></div></div><div class="progress"><i style="width:${pct}%"></i></div><div class="goal-foot"><span>${pct}% funded</span><span>${pct>=100?'Goal reached':'Remaining '+money(g.target-g.saved)}</span></div></div>`}

function activityPage(){let el=$('#page-activity'),tx=S.state.transactions,unc=tx.filter(t=>t.category==='Other').length;$('#uncatcount').textContent=unc||'';el.innerHTML=`${head('Transactions','Your corrections become rules for the next statement.',`<button class="btn primary" onclick="openImport()">＋ Import transactions</button>`)}<div class="card section-card"><div class="head"><div><h2>Transaction history</h2><p>${tx.length} most recent transactions · corrections are saved to your account</p></div><div class="table-tools"><input id="txsearch" class="input search" placeholder="Search merchant"><select id="txfilter" class="select"><option value="">All categories</option>${CATS.map(c=>`<option>${c}</option>`).join('')}</select></div></div>${tx.length?`<div class="tablehead"><span></span><span>Transaction</span><span>Category</span><span style="text-align:right">Amount</span><span style="text-align:right">Action</span></div><div id="txlist">${txRows(tx)}</div>`:`<div class="empty"><div class="big">↗</div><strong>No transactions yet</strong><span>Import a CSV or text based PDF statement to begin.</span></div>`}</div><div class="callout"><div class="callout-title">✳ How the correction loop works</div><p>Change a category on a transaction. Steady saves the merchant rule to your profile and applies it to future imports. It does not silently rewrite your previous transactions.</p></div>`;$('#txsearch')?.addEventListener('input',filterTx);$('#txfilter')?.addEventListener('change',filterTx)}

>Run a simulation to see the estimated effect on monthly cash flow.</p></div><button class="btn primary" onclick="runScenario()">Run scenario →</button><p class="muted" style="font-size:8px;line-height:1.5">Estimate only. Not investment advice. Nothing is moved or changed automatically.</p></section><section class="card row12"><div class="head"><div><h2>Goals you’re funding</h2><p>Target progress includes your saved balance and planned contribution pace.</p></div></div>${goals.length?`<div class="goalgrid">${goals.map(g=>`<div class="card goalcard">${goalHTML(g)}<div class="goal-foot"><span>Monthly contribution ${money(g.monthly)}</span><span>Target ${new Date(g.due_date+'T12:00:00').toLocaleDateString('en-US',{month:'long',year:'numeric'})}</span></div></div>`).join('')}</div>`:`<div class="empty"><strong>No goals added yet</strong><span>Put a name, amount, and target date on something you care about.</span></div>`}</section></div>`;$('#scenariovalue').oninput=e=>$('#scenarioamount').textContent=e.target.value+'%'}

function reviewPage(){const el=$('#page-review');el.innerHTML=`${head('Your monthly review','A calm, evidence based recap with context from your own profile.',`<button class="btn" onclick="window.print()">Print / save PDF</button>`)}<div id="reviewdata" class="grid"><div class="card row12"><div class="empty">Building your review…</div></div></div><div class="callout"><div class="callout-title">A note about these estimates</div><p>Reports use only your profile and imported statements in this Steady account. Pending charges and transactions from unconnected accounts are not included.</p></div>`;api('/review').then(d=>{$('#reviewdata').innerHTML=`<div class="card metric"><div class="metric-label">Income this month</div><div class="metric-value">${money(d.income)}</div><div class="metric-foot">From your imported activity or profile</div></div><div class="card metric"><div class="metric-label">Tracked spending</div><div class="metric-value">${money(d.spend)}</div><div class="metric-foot">Across ${d.topCategories.length} top categories</div></div><div class="card metric"><div class="metric-label">Savings rate · estimate</div><div class="metric-value">${Math.round(d.savingsRate)}%</div><div class="metric-foot">Profile based calculation</div></div><div class="card metric"><div class="metric-label">Recurring patterns</div><div class="metric-value">${d.recurringCount}</div><div class="metric-foot">Repeated payment detections</div></div><section class="card row7"><div class="head"><div><h2>Spending mix</h2><p>${escapeHTML(d.period)} · your imported transactions</p></div></div>${d.topCategories.length?d.topCategories.map(([n,v])=>`<div class="mini-stat"><span>${escapeHTML(n)}</span><b>${money(v)}</b></div>`).join(''):`<div class="empty">No spending data to summarize yet.</div>`}</section><section class="card row5"><div class="head"><div><h2>Goals progress</h2><p>Targets and dates you chose.</p></div></div>${d.goals.length?d.goals.map(g=>`<div class="mini-stat"><span>${escapeHTML(g.name)} · ${new Date(g.dueDate+'T12:00:00').toLocaleDateString('en-US',{month:'short',year:'numeric'})}</span><b>${money(g.saved)} / ${money(g.target)}</b></div>`).join(''):`<div class="empty">Add a goal to include it in your review.</div>`}</section><section class="card row12"><div class="head"><div><h2>One useful prompt</h2><p>Generated from observed patterns, with the reason shown.</p></div></div><div class="callout"><div class="callout-title">${escapeHTML(d.nudge)}</div><p>Choose what to do based on your own circumstances. Steady doesn’t give security-specific investment advice.</p></div><small class="muted">Prepared from local financial profile and transactions · ${escapeHTML(d.period)}</small></section>`}).catch(e=>toast(e.message))}
function profilePage(){const el=$('#page-profile'),p=S.state.profile;el.innerHTML=`${head('Financial profile','A persistent picture of income, costs, safety net, and what you’re working toward.') }<div class="grid"><section class="card row7"><div class="head"><div><h2>Your baseline</h2><p>Update this when your life or income changes. Used to make budgets and projections relevant.</p></div></div><form id="profileform"><div class="formgrid"><div class="field"><label>Monthly take-home income (${p.currency})</label><input class="input" name="monthlyIncome" type="number" min="0" value="${Number(p.monthlyIncome)||''}" placeholder="0"></div><div class="field"><label>Fixed costs each month</label><input class="input" name="fixedCosts" type="number" min="0" value="${Number(p.fixedCosts)||''}" placeholder="0"></div><div class="field"><label>Rent or mortgage each month</label><input class="input" name="monthlyRent" type="number" min="0" value="${Number(p.monthlyRent)||''}" placeholder="0"></div><div class="field"><label>Monthly essentials budget</label><input class="input" name="essentialBudget" type="number" min="0" value="${Number(p.essentialBudget)||''}" placeholder="Groceries, transport, health"></div><div class="field"><label>Emergency fund balance</label><input class="input" name="emergencyFund" type="number" min="0" value="${Number(p.emergencyFund)||''}" placeholder="0"></div></div><div class="field"><label>What should your plan keep in mind?</label><textarea class="textarea" name="goalsContext" rows="3" placeholder="For example: variable freelance income, supporting family, planned move">${escapeHTML(p.goalsContext||'')}</textarea></div><div class="field"><label>Currency</label><select class="select" name="currency">${['USD','CAD','GBP','EUR','INR'].map(c=>`<option ${p.currency===c?'selected':''}>${c}</option>`).join('')}</select></div><div id="profileerror" class="callout amber hidden"></div><button class="btn primary">Save financial profile</button></form></section><section class="card row5"><div class="head"><div><h2>What Steady calculates</h2><p>Your figures are used only to give your own plan context.</p></div></div><div class="mini-stat"><span>Fixed cost share</span><b>${S.state.financial.income?Math.round(S.state.financial.fixedCosts/S.state.financial.income*100):0}%</b></div><div class="mini-stat"><span>Emergency runway</span><b>${S.state.financial.runwayMonths.toFixed(1)} months</b></div><div class="mini-stat"><span>Goal pace per month</span><b>${money(S.state.goals.reduce((a,g)=>a+g.monthly,0))}</b></div><div class="callout" style="margin-top:14px"><div class="callout-title">Only as accurate as the inputs</div><p>Transactions may be missing, delayed, or categorized incorrectly. Use this as a planning estimate, not a guarantee.</p></div></section></div>`;$('#profileform').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.currentTarget));for(const k of ['monthlyIncome','fixedCosts','monthlyRent','essentialBudget','emergencyFund'])d[k]=Number(d[k]||0);try{await api('/profile',{method:'PUT',body:JSON.stringify(d)});await refresh();navigate('profile');toast('Financial profile saved securely in this app database.')}catch(x){$('#profileerror').textContent=x.message;$('#profileerror').classList.remove('hidden')}}}
function plansPage(){const el=$('#page-plans'),plans=S.state.plans,current=S.state.plan;el.innerHTML=`${head('Choose how much guidance you need','A transparent subscription model. Change plans whenever your needs change.') }<div class="callout"><div class="callout-title">Free to change the appearance</div><p>Light and dark appearance is included on every plan. Plan price changes feature limits, not access to your own data. Prices below are illustrative monthly USD prices; billing is not connected in this deployable starter.</p></div><div class="pricing">${Object.entries(plans).map(([key,p])=>`<article class="tier ${key===current?'selected':''}">${key===current?'<span class="tier-tag">YOUR PLAN</span>':''}<div class="tier-name">${escapeHTML(p.name)}</div><div class="muted" style="font-size:9px;margin-top:5px">${key==='free'?'A thoughtful start':key==='plus'?'More planning room':'A longer view'}</div><div class="tier-price">$${p.price}<small> / month</small></div><ul><li>${p.transactions.toLocaleString()} statement transactions / month</li><li>${p.goals} active goals</li><li>${p.scenarios} scenario simulations / month</li><li>${p.history} months of planning history</li><li>Category learning and recurring detection</li><li>PDF and CSV statement upload</li><li>Dark mode & profile controls included</li></ul><button class="btn ${key===current?'soft':'primary'}" style="width:100%" onclick="choosePlan('${key}')">${key===current?'Current plan':'Select '+escapeHTML(p.name)}</button></article>`).join('')}</div><div class="callout amber" style="margin-top:15px"><div class="callout-title">Billing status</div><p>Plan selection changes local feature entitlements only. There is no payment processor or charge flow in this release. Connect a payment provider, webhook verification, refunds, tax handling, and subscription cancellation before charging customers.</p></div>`}
async function choosePlan(plan){try{let d=await api('/settings',{method:'PUT',body:JSON.stringify({plan})});await refresh();navigate('plans');toast(d.notice)}catch(e){toast(e.message)}}
function settingsPage(){const el=$('#page-settings');el.innerHTML=`${head('Settings & safety','Control the look of the app, your data, and the boundaries of the coach.') }<div class="grid"><section class="card row7"><div class="head"><div><h2>Appearance</h2><p>Available on every plan. Your preference is saved to your account.</p></div></div><div class="setting-row"><div><div class="setting-title">Color theme</div><div class="setting-desc">Choose light or dark mode. Dark mode reduces glare in low light.</div></div><select class="select" id="themesel"><option value="light">Light</option><option value="dark">Dark</option><option value="system">Use device setting</option></select></div><div class="setting-row"><div><div class="setting-title">Download your data</div><div class="setting-desc">Export a copy of your profile, goals, budgets, and imported transactions.</div></div><button class="btn" onclick="exportData()">Download JSON</button></div><div class="setting-row"><div><div class="setting-title">Sign out</div><div class="setting-desc">Ends this browser session. Your saved profile remains on this server.</div></div><button class="btn" onclick="$('#logout').click()">Sign out</button></div></section><section class="card row5"><div class="head"><div><h2>Financial safety boundaries</h2><p>Core product behavior, not a premium add-on.</p></div></div><div class="callout"><div class="callout-title">Education and modelling only</div><p>The coach may explain budgets, transaction patterns, and scenario assumptions. It must not recommend particular stocks, bonds, funds, securities, or timing to buy or sell.</p></div><div class="callout"><div class="callout-title">You remain in control</div><p>Steady cannot move money, make payments, cancel subscriptions, or change bank accounts. Scenarios do not execute automatically.</p></div><div class="callout amber"><div class="callout-title">Protect your account</div><p>Use a unique password of at least 10 characters. Do not import statements on a shared device. This starter uses secure password hashing and account-scoped records; production still needs independent security review.</p></div></section><section class="card row12"><div class="head"><div><h2>How data is handled</h2><p>Statements are parsed in the app server and raw uploaded files are not retained.</p></div></div><div class="mini-stat"><span>Stored financial data</span><b>SQLite database on the configured server volume</b></div><div class="mini-stat"><span>Imports accepted</span><b>CSV and text-based PDF · up to 7 MB</b></div><div class="mini-stat"><span>Scanned PDF OCR</span><b>Not enabled in this release</b></div><div class="mini-stat"><span>Bank connection / JPMorgan account data</span><b>Requires authorized institution integration</b></div><div class="mini-stat"><span>In-app coach</span><b>Transparent rules and calculations; no generative AI service</b></div></section></div>`;$('#themesel').value=S.state.theme||'light';$('#themesel').onchange=e=>setTheme(e.target.value)}
function openModal(html){$('#modal').innerHTML=html;$('#modalback').classList.add('show')}function closeModal(){$('#modalback').classList.remove('show')}
function openImport(){openModal(`<div class="modal-head"><div><div class="eyebrow">ADD FINANCIAL ACTIVITY</div><h2 class="modal-title">Import a statement</h2></div><button class="modal-close" onclick="closeModal()">×</button></div><p class="modal-copy">CSV and text-based PDFs up to 7 MB. Files are parsed by this server and not retained. Scanned image PDFs require OCR and aren’t supported yet.</p><div class="tabs"><button class="tab active" id="filetab" onclick="importMode('file')">CSV or PDF</button><button class="tab" id="smstab" onclick="importMode('sms')">Transaction SMS</button></div><div id="import-area"><div class="filedrop" onclick="$('#statement').click()"><div style="font-size:21px;color:var(--green)">↑</div><strong>Choose a statement file</strong><span>CSV or PDF · up to 7 MB · imported transactions are stored in your workspace</span><input id="statement" type="file" accept=".csv,.pdf" class="hidden"></div><div id="import-error" class="callout amber hidden"></div><div id="import-status" class="muted" style="font-size:9px;margin-top:10px"></div></div>`);$('#statement').onchange=e=>importFile(e.target.files[0])}
function importMode(mode){$$('.tab').forEach(x=>x.classList.remove('active'));$('#'+(mode==='sms'?'smstab':'filetab')).classList.add('active');const area=$('#import-area');if(mode==='sms'){area.innerHTML=`<div class="field"><label>Paste the transaction message text</label><textarea id="smsmessage" class="textarea" rows="3" placeholder="Card purchase $24.50 at Corner Market on Oct 30"></textarea></div><div id="import-error" class="callout amber hidden"></div><button class="btn primary" onclick="importSms()">Parse and add transaction</button><p class="muted" style="font-size:9px">The message is sent to this app server and stored as a transaction. Remove personal information before pasting.</p>`}else{area.innerHTML=`<div class="filedrop" onclick="$('#statement').click()"><div style="font-size:21px;color:var(--green)">↑</div><strong>Choose a statement file</strong><span>CSV or PDF · up to 7 MB · imported transactions are stored in your workspace<input id="statement" type="file" accept=".csv,.pdf" class="hidden"></span></div><div id="import-error" class="callout amber hidden"></div><div id="import-status" class="muted" style="font-size:9px;margin-top:10px"></div>`;$('#statement').onchange=e=>importFile(e.target.files[0])}}
async function importFile(file){if(!file)return;let error=$('#import-error'),status=$('#import-status');try{if(file.size>7*1024*1024)throw Error('File is over 7 MB.');status.textContent='Reading and categorizing transactions…';let payload={filename:file.name};if(file.name.toLowerCase().endsWith('.csv'))payload.text=await file.text();else payload.base64=await new Promise((ok,no)=>{let r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=no;r.readAsDataURL(file)});let d=await api('/transactions/import',{method:'POST',body:JSON.stringify(payload)});await refresh();closeModal();navigate('activity');toast(`${d.added} transactions added · ${d.duplicates} duplicate rows skipped.`)}catch(e){error.textContent=e.message;error.classList.remove('hidden');status.textContent=''}}
async function importSms(){let text=$('#smsmessage').value.trim();try{let d=await api('/transactions/import',{method:'POST',body:JSON.stringify({filename:'transaction.sms',text})});await refresh();closeModal();navigate('activity');toast(`${d.added} SMS transaction added and categorized.`)}catch(e){$('#import-error').textContent=e.message;$('#import-error').classList.remove('hidden')}}
async function refresh(){let d=await api('/state');S=d;USER=d.name;renderShell();applyTheme()}
function applyTheme(){const theme=S?.state?.theme||'light';if(theme==='dark')document.body.classList.add('dark');else if(theme==='system')document.body.classList.toggle('dark',matchMedia('(prefers-color-scheme: dark)').matches);else document.body.classList.remove('dark')}
async function setTheme(theme){document.body.classList.toggle('dark',theme==='dark'||(theme==='system'&&matchMedia('(prefers-color-scheme: dark)').matches));try{await api('/settings',{method:'PUT',body:JSON.stringify({theme})});await refresh();navigate('settings');toast('Appearance preference saved.')}catch(e){toast(e.message)}}
async function toggleTheme(){let theme=document.body.classList.contains('dark')?'light':'dark';try{await api('/settings',{method:'PUT',body:JSON.stringify({theme})});await refresh();renderPage(currentPage)}catch(e){toast(e.message)}}
function exportData(){const blob=new Blob([JSON.stringify({name:USER,exportedAt:new Date().toISOString(),...S.state},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='steady-financial-data.json';a.click();URL.revokeObjectURL(a.href);toast('Your data export has been created.')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});loadApp();
</script></body></html>
